packaging_format = 2

id = "wekan"
name = "Wekan"
description.en = "Trello-like kanban"
description.fr = "Kanban similaire à Trello"

version = "13.36~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://wekan.github.io"
demo = "https://demo.sandstorm.io/appdemo/m86q05rdvj14yvn78ghaxynqz7u2svw6rnttptxx49g1785cdv1h"
admindoc = "https://github.com/wekan/wekan/wiki"
code = "https://github.com/wekan/wekan"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/wekan"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

        [resources.sources.main]
        amd64.url = "https://github.com/wekan/wekan/releases/download/v13.36/wekan-13.36-amd64.zip"
        amd64.sha256 = "a2ad21edddf4ab816e06bc3fa51e7c0cc123b7a6e623cb93441479252bac7b3e"
        arm64.url = "https://github.com/wekan/wekan/releases/download/v13.36/wekan-13.36-arm64.zip"
        arm64.sha256 = "0fb55153b9fc06ed28566191cf8d30bdf9d8ceb93ce2dfee51a5964ace41b95f"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "wekan-\\d+\\.\\d+-amd64.zip$"
        autoupdate.asset.arm64 = "wekan-\\d+\\.\\d+-arm64.zip$"

    [resources.ports]

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    admin.allowed = "admins"

    [resources.nodejs]
    version = "24"

    [resources.apt]
    packages = [
      "build-essential",
    ]
