packaging_format = 2

id = "wekan"
name = "Wekan"
description.en = "Trello-like kanban"
description.fr = "Kanban similaire à Trello"

version = "12.75~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://wekan.github.io"
demo = "https://demo.sandstorm.io/appdemo/m86q05rdvj14yvn78ghaxynqz7u2svw6rnttptxx49g1785cdv1h"
admindoc = "https://github.com/wekan/wekan/wiki"
code = "https://github.com/wekan/wekan"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/wekan"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

        [resources.sources.main]
        amd64.url = "https://github.com/wekan/wekan/releases/download/v12.75/wekan-12.75-amd64.zip"
        amd64.sha256 = "163387fc91a2c30b75a58b5070a79bec9ea73b88088c1da57da4d9151e808189"
        arm64.url = "https://github.com/wekan/wekan/releases/download/v12.75/wekan-12.75-arm64.zip"
        arm64.sha256 = "571a8dda6312b80e49a2c61de1609f45f6bf573da0a5db021fc4a2e418f89b2d"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "wekan-\\d+\\.\\d+-amd64.zip$"
        autoupdate.asset.arm64 = "wekan-\\d+\\.\\d+-arm64.zip$"

    [resources.ports]

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    admin.allowed = "admins"

    [resources.nodejs]
    version = "24"

    [resources.apt]
    packages = [
      "build-essential",
    ]
