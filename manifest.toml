packaging_format = 2

id = "wekan"
name = "Wekan"
description.en = "Trello-like kanban"
description.fr = "Kanban similaire à Trello"

version = "12.38~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://wekan.github.io"
demo = "https://demo.sandstorm.io/appdemo/m86q05rdvj14yvn78ghaxynqz7u2svw6rnttptxx49g1785cdv1h"
admindoc = "https://github.com/wekan/wekan/wiki"
code = "https://github.com/wekan/wekan"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/wekan"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

        [resources.sources.main]
        amd64.url = "https://github.com/wekan/wekan/releases/download/v12.38/wekan-12.38-amd64.zip"
        amd64.sha256 = "6a411fa4b3ad784dfa6ae15db09d635f77c595f732490e813d663df37cf8292c"
        arm64.url = "https://github.com/wekan/wekan/releases/download/v12.38/wekan-12.38-arm64.zip"
        arm64.sha256 = "c8d05adbe6e6bff76aec4db2de7f14d1342813a0b802c18c129cece6a6d61faa"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "wekan-\\d+\\.\\d+-amd64.zip$"
        autoupdate.asset.arm64 = "wekan-\\d+\\.\\d+-arm64.zip$"

    [resources.ports]

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    admin.allowed = "admins"

    [resources.nodejs]
    version = "24"

    [resources.apt]
    packages = [
      "build-essential",
    ]
